name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev libltdl-dev \
            build-essential

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0 cython==0.29.37

      - name: Build APK
        run: |
          buildozer android debug

      - name: Check APK exists
        run: |
          ls -lh bin/ || true
          find bin -type f -name "*.apk" | head -20
          if ! find bin -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No APK found in bin/"
            exit 1
          fi
          echo "APK found:"
          ls -lh bin/*.apk
          find bin -type f -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openfood-apk
          path: bin/*.apk
          if-no-files-found: error
