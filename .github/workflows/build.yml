name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev libltdl-dev \
            build-essential

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0 cython==0.29.37

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-v4
          restore-keys: buildozer-

      - name: Vendor freetype (pre-build, if cache warm)
        run: |
          mkdir -p ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype
          mkdir -p ~/.buildozer/android/platform/build-armeabi-v7a/packages/freetype
          mkdir -p ~/.buildozer/android/platform/build-x86_64/packages/freetype
          for d in ~/.buildozer/android/platform/build-*/packages/freetype; do
            cp vendor/freetype-2.14.1.tar.gz "$d/freetype-2.14.1.tar.gz" 2>&1 || true
            touch "$d/.mark-freetype-2.14.1.tar.gz" 2>&1 || true
            touch "$d/freetype-2.14.1.tar.gz.mark" 2>&1 || true
          done
          ls -lh vendor/freetype-2.14.1.tar.gz

      - name: Build APK (first attempt)
        run: |
          buildozer android debug || echo "First build needs license fix, continuing"

      - name: Fix SDK licenses and vendor freetype (post-SDK)
        run: |
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          SDK=~/.buildozer/android/platform/android-sdk
          ls -R $SDK 2>&1 | head -80 || true
          if [ -f $SDK/cmdline-tools/latest/bin/sdkmanager ] && [ ! -f $SDK/tools/bin/sdkmanager ]; then
            mkdir -p $SDK/tools/bin
            ln -sf $SDK/cmdline-tools/latest/bin/sdkmanager $SDK/tools/bin/sdkmanager
          fi
          if [ -f $SDK/cmdline-tools/bin/sdkmanager ] && [ ! -f $SDK/tools/bin/sdkmanager ]; then
            mkdir -p $SDK/tools/bin
            ln -sf $SDK/cmdline-tools/bin/sdkmanager $SDK/tools/bin/sdkmanager
          fi
          mkdir -p $SDK/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > $SDK/licenses/android-sdk-preview-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $SDK/licenses/android-googletv-license
          cat $SDK/licenses/android-sdk-license
          if [ -f $SDK/tools/bin/sdkmanager ]; then
            yes | $SDK/tools/bin/sdkmanager --sdk_root=$SDK --licenses || true
            yes | $SDK/tools/bin/sdkmanager --sdk_root=$SDK "build-tools;37.0.0" || true
          fi
          if [ -f $SDK/cmdline-tools/latest/bin/sdkmanager ]; then
            yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK --licenses || true
          fi
          # Re-vendor freetype now that p4a created build dirs
          for d in ~/.buildozer/android/platform/build-*/packages/freetype; do
            mkdir -p "$d"
            cp vendor/freetype-2.14.1.tar.gz "$d/freetype-2.14.1.tar.gz" 2>&1 || true
            touch "$d/.mark-freetype-2.14.1.tar.gz" 2>&1 || true
            touch "$d/freetype-2.14.1.tar.gz.mark" 2>&1 || true
            ls -lh "$d/" 2>&1 | head -5 || true
          done
          # Local recipe override handles Savannah 502

      - name: Build APK (retry)
        run: |
          buildozer android debug

      - name: Check APK exists
        run: |
          ls -lh bin/ || true
          find bin -type f -name "*.apk" | head -20
          if ! find bin -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No APK found in bin/"
            exit 1
          fi
          ls -lh bin/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openfood-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (on push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OpenFood build ${{ github.run_number }}
          body: |
            APK auto-build desde main.
            - Commit: ${{ github.sha }}
            - Modelo: gemini-3.5-flash-lite (Fud AI)
            - Instala el APK y pon tu GEMINI_API_KEY en la app.
          files: bin/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
