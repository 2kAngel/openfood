name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev libltdl-dev \
            build-essential

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0 cython==0.29.37

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-googletv-license
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cat ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license || true
          ls -lh ~/.buildozer/android/platform/android-sdk/licenses/ || true

      - name: Build APK
        run: |
          buildozer android debug

      - name: Check APK exists
        run: |
          ls -lh bin/ || true
          find bin -type f -name "*.apk" | head -20
          if ! find bin -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No APK found in bin/"
            exit 1
          fi
          echo "APK found:"
          ls -lh bin/*.apk
          find bin -type f -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openfood-apk
          path: bin/*.apk
          if-no-files-found: error
