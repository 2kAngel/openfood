name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev libltdl-dev \
            build-essential

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0 cython==0.29.37

      - name: Clean incomplete SDK cache
        run: |
          rm -rf ~/.buildozer/android/platform/android-sdk
          rm -rf ~/.buildozer/android/platform/android-ndk*
          ls -lh ~/.buildozer/android/platform/ 2>&1 | head -20 || true

      - name: Pre-download freetype workaround (Savannah 502)
        run: |
          mkdir -p ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype
          echo "Trying alternative mirrors for freetype..."
          wget -q https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz -O /tmp/freetype-2.14.1.tar.gz && echo "Savannah mirror OK" || \
          wget -q https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz -O /tmp/freetype-2.14.1.tar.gz && echo "SourceForge OK" || \
          wget -q https://github.com/freetype/freetype/archive/VER-2-14-1.tar.gz -O /tmp/freetype-2.14.1.tar.gz && echo "GitHub OK" || echo "All mirrors failed"
          if [ -f /tmp/freetype-2.14.1.tar.gz ]; then
            cp /tmp/freetype-2.14.1.tar.gz ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype/freetype-2.14.1.tar.gz || true
            ls -lh ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype/ || true
            ls -lh /tmp/freetype-2.14.1.tar.gz || true
          fi
          mkdir -p ~/.buildozer/android/platform/build-armeabi-v7a/packages/freetype 2>&1 || true
          cp /tmp/freetype-2.14.1.tar.gz ~/.buildozer/android/platform/build-armeabi-v7a/packages/freetype/freetype-2.14.1.tar.gz 2>&1 || true

      - name: Build APK
        run: |
          buildozer android debug || echo "First build attempt finished (may need license fix)"

      - name: Accept Android SDK licenses and fix sdkmanager
        run: |
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          find ~/.buildozer -name sdkmanager 2>&1 | head -20 || true
          ls -R ~/.buildozer/android/platform/android-sdk 2>&1 | head -100 || true
          SDK=~/.buildozer/android/platform/android-sdk
          if [ -f $SDK/cmdline-tools/latest/bin/sdkmanager ] && [ ! -f $SDK/tools/bin/sdkmanager ]; then
            mkdir -p $SDK/tools/bin
            ln -sf $SDK/cmdline-tools/latest/bin/sdkmanager $SDK/tools/bin/sdkmanager
            echo "Fixed symlink tools->cmdline-tools"
          fi
          if [ -f $SDK/cmdline-tools/bin/sdkmanager ] && [ ! -f $SDK/tools/bin/sdkmanager ]; then
            mkdir -p $SDK/tools/bin
            ln -sf $SDK/cmdline-tools/bin/sdkmanager $SDK/tools/bin/sdkmanager
            echo "Fixed symlink tools->cmdline-tools/bin"
          fi
          ls -lh $SDK/tools/bin/sdkmanager 2>&1 || echo "sdkmanager still missing"
          ls -lh $SDK/cmdline-tools/ 2>&1 | head -20 || true
          mkdir -p $SDK/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > $SDK/licenses/android-sdk-preview-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $SDK/licenses/android-googletv-license
          cat $SDK/licenses/android-sdk-license
          ls -lh $SDK/licenses/ || true
          if [ -f $SDK/tools/bin/sdkmanager ]; then
            yes | $SDK/tools/bin/sdkmanager --sdk_root=$SDK --licenses || true
            yes | $SDK/tools/bin/sdkmanager --sdk_root=$SDK "build-tools;37.0.0" || true
            ls -lh $SDK/build-tools/ 2>&1 | head -20 || true
          fi
          if [ -f $SDK/cmdline-tools/latest/bin/sdkmanager ]; then
            yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK --licenses || true
          fi

      - name: Build APK (retry)
        run: |
          buildozer android debug

      - name: Check APK exists
        run: |
          ls -lh bin/ || true
          find bin -type f -name "*.apk" | head -20
          if ! find bin -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No APK found in bin/"
            exit 1
          fi
          echo "APK found:"
          ls -lh bin/*.apk
          find bin -type f -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openfood-apk
          path: bin/*.apk
          if-no-files-found: error
